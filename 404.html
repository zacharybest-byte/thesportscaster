<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — The Sportscaster</title>
<meta name="robots" content="noindex">
<style>
*{box-sizing:border-box;}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px 24px;
     background:#14161c;color:#f2f5f7;font-family:Charter,Georgia,'Times New Roman',serif;-webkit-font-smoothing:antialiased;}
h1{margin:0;font-weight:900;text-transform:uppercase;letter-spacing:0.01em;line-height:0.94;font-size:clamp(34px,7vw,72px);}
p{margin:20px 0 0;color:#9fb2bf;font-size:17px;line-height:1.7;}
.rule{height:3px;width:48px;background:#e83151;margin:0 auto 26px;}
a.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 28px;margin-top:30px;
      background:#f2f5f7;color:#14161c;text-transform:uppercase;letter-spacing:0.16em;font-size:12.5px;text-decoration:none;}
a.btn:hover{background:#fff;}
</style>
</head>
<body>
  <div>
    <div class="rule"></div>
    <h1>Page not found</h1>
    <p>That page doesn&rsquo;t exist &mdash; but the film does.</p>
    <a class="btn" id="home" href="/">Back to The Sportscaster</a>
  </div>
<script>
/* Works whether the site sits at the domain root or inside a subfolder. */
(function(){
  var p = location.pathname.split('/').filter(Boolean);
  document.getElementById('home').href = p.length > 1 ? '/' + p[0] + '/' : '/';
})();
</script>
</body>
</html>
